# =====================================================================================================
# container, with ONE command. You don't install any of them on your laptop.
#
#   docker compose up -d      start them all in the background (-d = detached); the app then runs on your Mac
#                             (./mvnw spring-boot:run) and reaches them on localhost
#   docker compose --profile cluster up -d --build
#                             ALSO build the app's image (Dockerfile) and run TWO copies of it (app1, app2) behind
#                             nginx, on http://localhost:8080 (Phase 3;, HLD.md 9.13)
#   docker compose --profile cluster --profile monitoring up -d --build
#                             ...plus Prometheus (http://localhost:9090) and Grafana (http://localhost:3000), with the
#                             "Flash sale engine" dashboard ready (Phase 4;). "--profile monitoring" alone
#                             watches the app running on your Mac instead.
#   docker compose ps         are they running and healthy?
#   docker compose logs -f    watch their logs
#   docker compose down       stop and remove the containers (data in the volume is KEPT)
#   docker compose down -v    ...and also delete the data volume (a fresh, empty database next time)
#
# Tests don't need this file: Testcontainers starts its own throwaway containers (TestcontainersConfiguration.java).
# =====================================================================================================
services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flashsale
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d flashsale"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"                  # Redis's standard port, published as localhost:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]   # Redis answers PONG when it's ready
      interval: 2s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # one broker: Kafka's own topics can only have 1 copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20

  # ---------------------------------------------------------------------------------------------------
  # Profile "cluster": two copies of our app behind nginx. Not started by a plain "docker compose up".
  # ---------------------------------------------------------------------------------------------------
  app1: &app
    profiles: [cluster]
    build: .                          # the Dockerfile in this folder
    image: flash-sale-engine:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashsale
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_APPLICATION_NAME: flash-sale-engine-app1   # shows up in every log line, so you can tell them apart
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 40
    cpus: 1.0

  app2:
    <<: *app
    environment:                      # ...except its name
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flashsale
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_APPLICATION_NAME: flash-sale-engine-app2

  nginx:
    profiles: [cluster]
    build: ./frontend
    image: flash-sale-frontend
    ports:
      - "8080:80"                     # the same port as the app on your Mac, so every curl in the docs still works
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    environment:
      UPSTREAM_1: app1:8080
      UPSTREAM_2: app2:8080
      IP_RATE: ${NGINX_IP_RATE:-20r/s}
      IP_BURST: ${NGINX_IP_BURST:-40}
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }

  # ---------------------------------------------------------------------------------------------------
  # Profile "monitoring": Prometheus collects the metrics, Grafana draws them (Phase 4).
  # ---------------------------------------------------------------------------------------------------
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"                   # http://localhost:9090: queries, and /targets shows what it scrapes
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # to reach the app on your Mac (Linux needs this line; Mac has it built in)

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"                   # http://localhost:3000 -> Dashboards -> Flash sale -> Flash sale engine
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flash-sale.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
